# The root CA signs certificates for services that only cluster workloads
# connect to directly, such as OpenBao, Valkey and PostgreSQL. Browsers never
# see it. The Gateway serves a Let's Encrypt certificate instead.
# https://cert-manager.io/docs/configuration/ca/
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
  labels:
    {{- include "pki-internal.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: touchgrass-internal-root
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pki-internal.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: Touch Grass Software internal root CA
  subject:
    organizations:
      - Touch Grass Software
  secretName: touchgrass-internal-root
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
    # A new key on renewal would invalidate every certificate the CA signed
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned
---
# A ClusterIssuer reads its CA Secret from the cert-manager namespace
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca
  labels:
    {{- include "pki-internal.labels" . | nindent 4 }}
spec:
  ca:
    secretName: touchgrass-internal-root
