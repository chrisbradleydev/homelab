# External Secrets logs in to OpenBao with a short-lived token for this
# namespace's openbao-reader ServiceAccount. The ns-cert-manager role in
# terraform/openbao allows reads only under kv/platform/cert-manager/.
# https://external-secrets.io/latest/provider/hashicorp-vault/
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-secrets.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.openbaoServer }}
      path: kv
      version: v2
      # trust-manager writes the internal root CA to this ConfigMap
      caProvider:
        type: ConfigMap
        name: internal-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ns-cert-manager
          serviceAccountRef:
            name: openbao-reader
            # The role accepts only tokens issued for this audience
            audiences:
              - openbao
