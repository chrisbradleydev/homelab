# The OpenBao listener serves this certificate on 8200 for clients and for
# retry_join between the pods. tls_auto_reload picks up renewals without a
# restart. Raft traffic on 8201 uses OpenBao's own certificates.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openbao-extras.labels" . | nindent 4 }}
spec:
  secretName: openbao-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: internal-ca
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - openbao
    - openbao.{{ .Release.Namespace }}.svc
    - openbao.{{ .Release.Namespace }}.svc.cluster.local
    - openbao-active
    - openbao-active.{{ .Release.Namespace }}.svc
    - openbao-active.{{ .Release.Namespace }}.svc.cluster.local
    - "*.openbao-internal"
    - "*.openbao-internal.{{ .Release.Namespace }}.svc"
    - "*.openbao-internal.{{ .Release.Namespace }}.svc.cluster.local"
    # kubectl port-forward for initialization and the first Terraform run
    - localhost
  ipAddresses:
    - 127.0.0.1
