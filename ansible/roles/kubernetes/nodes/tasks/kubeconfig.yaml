# Copy admin.conf for root and the cloud-init user. Also runs after upgrades
# because kubeadm renews the embedded client certificate.
- name: Create root .kube directory
  become: true
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy admin.conf for root
  become: true
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"

- name: Create .kube directory for {{ kubernetes_ciuser }}
  become: true
  ansible.builtin.file:
    path: "/home/{{ kubernetes_ciuser }}/.kube"
    state: directory
    owner: "{{ kubernetes_ciuser }}"
    group: "{{ kubernetes_ciuser }}"
    mode: "0700"

- name: Copy admin.conf for {{ kubernetes_ciuser }}
  become: true
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ kubernetes_ciuser }}/.kube/config"
    remote_src: true
    owner: "{{ kubernetes_ciuser }}"
    group: "{{ kubernetes_ciuser }}"
    mode: "0600"
