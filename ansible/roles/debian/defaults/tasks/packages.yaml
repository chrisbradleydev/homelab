- name: Install packages
  become: true
  ansible.builtin.apt:
    name:
      - bind9-dnsutils
      - fzf
      - git
      - iperf3
      - make
      - ripgrep
      - rsync
      - unzip
      - vim
      - zsh

- name: Set default shell for user
  become: true
  ansible.builtin.user:
    name: chrisbradley
    shell: /usr/bin/zsh
