home:
  hosts:
    # vlan 1
    moby.localdomain:
      ansible_host: 192.168.1.11
      ansible_port: 22
      ansible_user: chrisbradley
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    dick.localdomain:
      ansible_host: 192.168.1.12
      ansible_port: 22
      ansible_user: chrisbradley
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      debian_protonvpn: true
      debian_protonvpn_lan_routes:
        - to: 192.168.10.0/24
          via: 192.168.1.1
        - to: 192.168.20.0/24
          via: 192.168.1.1
        - to: 192.168.30.0/24
          via: 192.168.1.1
        - to: 192.168.40.11/32
          via: 192.168.1.1
      debian_protonvpn_lan_dns: 192.168.1.1
      debian_protonvpn_lan_dns_domains:
        - localdomain
        - internal.touchgrass.software
    # vlan 20
    unifi.localdomain:
      ansible_host: 192.168.10.10
      ansible_port: 22
      ansible_user: chrisbradley
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    # vlan 20
    pve1.localdomain:
      ansible_host: 192.168.20.11
      ansible_port: 22
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    pve2.localdomain:
      ansible_host: 192.168.20.12
      ansible_port: 22
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    pve3.localdomain:
      ansible_host: 192.168.20.13
      ansible_port: 22
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    # vlan 30
    kube1.localdomain:
      ansible_host: 192.168.30.11
      ansible_port: 22
      ansible_user: chrisbradley
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      kubernetes_zone: pve1 # Proxmox host, see topology.kubernetes.io/zone
    kube2.localdomain:
      ansible_host: 192.168.30.12
      ansible_port: 22
      ansible_user: chrisbradley
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      kubernetes_zone: pve2 # Proxmox host, see topology.kubernetes.io/zone
    kube3.localdomain:
      ansible_host: 192.168.30.13
      ansible_port: 22
      ansible_user: chrisbradley
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
      kubernetes_zone: pve1 # Proxmox host, see topology.kubernetes.io/zone
    # vlan 40
    ahab.localdomain:
      ansible_host: 192.168.40.11
      ansible_port: 22
      ansible_user: chrisbradley
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    localhost:
      ansible_connection: local

kubernetes:
  children:
    kubernetes_control_plane:
      hosts:
        kube1.localdomain:
    kubernetes_workers:
      hosts:
        kube2.localdomain:
        kube3.localdomain:

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
